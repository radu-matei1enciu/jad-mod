#
# Consumer physical connector dataplane config
#

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dataplane-config
  namespace: consumer
data:
  edc.hostname: "dataplane.consumer.svc.cluster.local"

  # Optional but good to keep aligned with the consumer identity
  edc.participant.id: "did:web:identityhub.consumer.svc.cluster.local%3A7083:physical-consumer"

  # HTTP endpoints
  web.http.port: "8080"
  web.http.path: "/api"

  web.http.control.port: "8083"
  web.http.control.path: "/api/control"

  web.http.public.port: "11002"
  web.http.public.path: "/api/public"

  web.http.certs.port: "8186"
  web.http.certs.path: "/api/data"

  # Public dataplane endpoint used in EDRs
  edc.dataplane.api.public.baseurl: "http://dataplane.consumer.svc.cluster.local:11002/api/public"

  # Vault
  edc.vault.hashicorp.url: "http://vault.consumer.svc.cluster.local:8200"
  edc.vault.hashicorp.token: "root"

  # PostgreSQL
  edc.datasource.default.url: "jdbc:postgresql://postgres.consumer.svc.cluster.local:5432/dataplane"
  edc.datasource.default.user: "dp"
  edc.datasource.default.password: "dp"
  edc.sql.schema.autocreate: "true"

  # Required by the JAD dataplane image
  edc.iam.siglet.issuer: "siglet-issuer"
  edc.iam.siglet.jwks.url: "http://siglet.edc-v.svc.cluster.local:8080/keys"

  # Reduce OTEL noise
  OTEL_SDK_DISABLED: "true"

  JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=1044"