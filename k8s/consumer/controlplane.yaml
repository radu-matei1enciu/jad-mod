---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
  namespace: consumer
  labels:
    app: controlplane
    type: consumer-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controlplane
  template:
    metadata:
      name: controlplane
      labels:
        app: controlplane
        type: consumer-app
    spec:
      containers:
        - name: controlplane
          # JAD pinned image — ensures DCP + CEL compatibility with JAD's IssuerService
          image: ghcr.io/metaform/jad/controlplane@sha256:d078abfc2e588943f9159bd20aaa95784acbe20a30a0ad149460a989e7191be1
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: controlplane-config
          ports:
            - containerPort: 8080
              name: default-port
            - containerPort: 8081
              name: management-port
            - containerPort: 8082
              name: protocol-port
            - containerPort: 1044
              name: debug-port
          livenessProbe:
            httpGet:
              path: /api/check/liveness
              port: 8080
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 120
          readinessProbe:
            httpGet:
              path: /api/check/readiness
              port: 8080
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 120
          startupProbe:
            httpGet:
              path: /api/check/startup
              port: 8080
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 120
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: controlplane
  namespace: consumer
spec:
  type: ClusterIP
  selector:
    app: controlplane
  ports:
    - name: health
      port: 8080
      targetPort: 8080
    - name: management
      port: 8081
      targetPort: 8081
    - name: protocol
      port: 8082
      targetPort: 8082
    - name: control
      port: 8083
      targetPort: 8083
    - name: debug
      port: 1044
      targetPort: 1044

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: controlplane
  namespace: consumer
spec:
  parentRefs:
    - name: consumer-gateway
      kind: Gateway
      sectionName: http
  hostnames:
    - cp.consumer.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: controlplane
          port: 8081
          weight: 1