---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identityhub
  namespace: consumer
  labels:
    app: identityhub
    type: consumer-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identityhub
  template:
    metadata:
      labels:
        app: identityhub
        type: consumer-app
    spec:
      containers:
        - name: identityhub
          # JAD pinned image — required for CatenaMembershipCredential + VC2_0_JOSE compatibility
          image: ghcr.io/metaform/jad/identity-hub@sha256:0e4bf0448d34be0c1190991739bebae6d22445b59011fd259d184dc978ded2b2
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ih-config
          ports:
            - containerPort: 7080
              name: web
            - containerPort: 7081
              name: identity-api
            - containerPort: 7082
              name: creds-port
            - containerPort: 7083
              name: did
            - containerPort: 7084
              name: sts
            - containerPort: 1044
              name: debug
          livenessProbe:
            httpGet:
              path: /api/check/liveness
              port: 7080
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 120
          readinessProbe:
            httpGet:
              path: /api/check/readiness
              port: 7080
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 120
          startupProbe:
            httpGet:
              path: /api/check/startup
              port: 7080
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 120

---
apiVersion: v1
kind: Service
metadata:
  name: identityhub
  namespace: consumer
spec:
  type: ClusterIP
  selector:
    app: identityhub
  ports:
    - port: 7080
      targetPort: 7080
      name: web
    - port: 7081
      targetPort: 7081
      name: identity-api
    - port: 7082
      targetPort: 7082
      name: creds-port
    - port: 7083
      targetPort: 7083
      name: did
    - port: 7084
      targetPort: 7084
      name: sts
    - port: 1044
      targetPort: 1044
      name: debug

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identityhub
  namespace: consumer
spec:
  parentRefs:
    - name: consumer-gateway
      kind: Gateway
      sectionName: http
  hostnames:
    - ih.consumer.localhost
  rules:
    # Identity admin API — /cs prefix is rewritten to / before forwarding
    - matches:
        - path:
            type: PathPrefix
            value: /cs
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: identityhub
          port: 7081
    # DID document resolution (default route)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: identityhub
          port: 7083
