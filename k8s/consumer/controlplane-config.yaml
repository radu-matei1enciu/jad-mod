---
apiVersion: v1
kind: ConfigMap
metadata:
  name: controlplane-config
  namespace: consumer
data:
  # ── Identity ──────────────────────────────────────────────────────────────
  edc.participant.id: "did:web:identityhub.consumer.svc.cluster.local%3A7083:physical-consumer"
  edc.hostname: "controlplane.consumer.svc.cluster.local"
  edc.iam.did.web.use.https: "false"
  edc.iam.credential.revocation.mimetype: "application/json"

  edc.dsp.callback.address: "http://controlplane.consumer.svc.cluster.local:8082/api/dsp/physical-consumer"

  # ── HTTP endpoints ────────────────────────────────────────────────────────
  web.http.port: "8080"
  web.http.path: "/api"

  web.http.protocol.port: "8082"
  web.http.protocol.path: "/api/dsp"
  web.http.protocol.virtual: "true"

  web.http.management.port: "8081"
  web.http.management.path: "/api/mgmt"

  web.http.control.port: "8083"
  web.http.control.path: "/api/control"

  # ── Vault ─────────────────────────────────────────────────────────────────
  edc.vault.hashicorp.url: "http://vault.consumer.svc.cluster.local:8200"
  edc.vault.hashicorp.token: "root"
  edc.encryption.aes.key.alias: "aes-key-alias"

  # ── STS ───────────────────────────────────────────────────────────────────
  edc.iam.sts.oauth.token.url: "http://identityhub.consumer.svc.cluster.local:7084/api/sts/token"
  edc.iam.sts.oauth.client.id: "did:web:identityhub.consumer.svc.cluster.local%3A7083:physical-consumer"
  edc.iam.sts.oauth.client.secret.alias: "physical-consumer-sts-client-secret"

  # ── OAuth2 / Keycloak ─────────────────────────────────────────────────────
  edc.iam.oauth2.issuer: "http://keycloak.edc-v.svc.cluster.local:8080/realms/edcv"
  edc.iam.oauth2.jwks.url: "http://keycloak.edc-v.svc.cluster.local:8080/realms/edcv/protocol/openid-connect/certs"

  # ── DCP credential scope ──────────────────────────────────────────────────
  edc.iam.dcp.scopes.catena-membership.id: "catena-membership-scope"
  edc.iam.dcp.scopes.catena-membership.type: "DEFAULT"
  edc.iam.dcp.scopes.catena-membership.value: "org.eclipse.dspace.dcp.vc.type:CatenaMembershipCredential:read"

  # ── NATS ──────────────────────────────────────────────────────────────────
  edc.nats.cn.subscriber.url: "nats://nats.edc-v.svc.cluster.local:4222"
  edc.nats.cn.subscriber.autocreate: "true"
  edc.nats.cn.publisher.url: "nats://nats.edc-v.svc.cluster.local:4222"

  edc.nats.tp.subscriber.url: "nats://nats.edc-v.svc.cluster.local:4222"
  edc.nats.tp.subscriber.autocreate: "true"
  edc.nats.tp.publisher.url: "nats://nats.edc-v.svc.cluster.local:4222"

  # ── Trusted issuer ────────────────────────────────────────────────────────
  edc.iam.trusted-issuer.issuer.id: "did:web:issuerservice.edc-v.svc.cluster.local%3A10016:issuer"

  # ── Database ──────────────────────────────────────────────────────────────
  edc.datasource.default.url: "jdbc:postgresql://postgres.consumer.svc.cluster.local:5432/controlplane"
  edc.datasource.default.user: "cp"
  edc.datasource.default.password: "cp"
  edc.sql.schema.autocreate: "true"

  # ── Debug / noise reduction ───────────────────────────────────────────────
  OTEL_SDK_DISABLED: "true"
  JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=1044"