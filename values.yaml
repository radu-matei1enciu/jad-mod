logs:
  access:
    enabled: true
    format: json
    fields:
      general:
        # full field list
        # https://doc.traefik.io/traefik/reference/install-configuration/observability/logs-and-accesslogs/#json-format-fields
        names:
          RouterName: drop

ports:
  web:
    port: 80
  websecure:
    port: 443
    exposedPort: 443

# we enable gateway-api features
providers:
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    # -- Load Kubernetes IngressRoute provider
    enabled: true

# we disable gateway-api defaults because we want to provide our own
gatewayClass:
  enabled: false

# we disable gateway-api defaults because we want to provide our own
gateway:
  enabled: false

hostNetwork: true
deployment:
  dnsPolicy: ClusterFirstWithHostNet
securityContext:
  capabilities:
    drop: [ ALL ]
    add: [ NET_BIND_SERVICE ]
  readOnlyRootFilesystem: true
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0
 
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: luis-agentic-demo
